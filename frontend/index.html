<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2f4f6" />
    <title>크노 · 국민대 소식 대시보드</title>
    <link rel="stylesheet" href="./src/shared/ui/base.css" />
    <link rel="stylesheet" href="./src/shared/ui/buttons.css" />
    <link rel="stylesheet" href="./src/shared/ui/sidebar.css" />
    <link rel="stylesheet" href="./src/shared/ui/layout.css" />
    <link rel="stylesheet" href="./src/shared/ui/profile-card.css" />
    <link rel="stylesheet" href="./src/shared/ui/states.css" />
    <link rel="stylesheet" href="./src/shared/ui/DemoBanner.css" />
    <link rel="stylesheet" href="./src/features/feed/feed.css" />
    <link rel="stylesheet" href="./src/features/feed/CategoryFilter.css" />
    <link rel="stylesheet" href="./src/features/feed/DashboardSummary.css" />
    <link rel="stylesheet" href="./src/features/feed/FeedFilters.css" />
    <link rel="stylesheet" href="./src/features/feed/FeedCard.css" />
    <link rel="stylesheet" href="./src/features/notice/NoticeDetail.css" />
    <link rel="stylesheet" href="./src/features/apply-helper/ApplyPanel.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="주 메뉴">
        <a class="brand" href="#feed" aria-label="크노 홈">
          <span class="brand-mark">
            <svg class="icon" aria-hidden="true" focusable="false">
              <use href="./src/shared/ui/icons.svg#brand"></use>
            </svg>
          </span>
          <span>크노</span>
        </a>
        <nav id="category-navigation" aria-label="공고 카테고리"></nav>
      </aside>
      <main class="main-content" id="feed">
        <header class="topbar">
          <span class="workspace-label">국민대학교</span>
          <span class="service-label">
            <svg class="icon" aria-hidden="true" focusable="false">
              <use href="./src/shared/ui/icons.svg#shield"></use>
            </svg>
            내 정보는 이 기기에만
          </span>
        </header>
        <section class="welcome-row">
          <div>
            <p class="eyebrow">국민대 소식 대시보드</p>
            <h1>학교 소식과 기회, 한눈에</h1>
            <p class="subheading">필요한 카테고리를 함께 고르고, 원하는 공고를 찾아보세요.</p>
          </div>
          <div class="profile-overview">
            <span>내 추천 태그</span>
            <div class="tag-list" id="profile-tags"></div>
          </div>
        </section>
        <section id="dashboard-summary" class="dashboard-summary" aria-label="공고 현황"></section>
        <nav id="mobile-categories" aria-label="공고 카테고리"></nav>

        <section class="feed-layout" aria-label="공고 목록">
          <div class="feed-column">
            <div class="feed-heading">
              <div>
                <h2>
                  <span id="feed-title">전체 공고</span>
                  <span class="count" id="result-count">—</span>
                </h2>
                <p id="results-description" role="status">학교 소식과 새로운 기회를 확인해요.</p>
              </div>
              <label class="sort-control">
                <span class="sr-only">정렬 기준</span>
                <select id="sort-select">
                  <option value="recommend">추천순</option>
                  <option value="deadline">마감 임박순</option>
                </select>
                <span class="select-arrow">
                  <svg class="icon" aria-hidden="true" focusable="false">
                    <use href="./src/shared/ui/icons.svg#chevron-down"></use>
                  </svg>
                </span>
              </label>
            </div>
            <div class="filters">
              <label class="search-box">
                <svg class="icon" aria-hidden="true" focusable="false">
                  <use href="./src/shared/ui/icons.svg#search"></use>
                </svg>
                <input
                  id="search-input"
                  type="search"
                  aria-label="제목, 요약, 출처, 태그 검색"
                  placeholder="제목, 요약, 출처, 태그로 검색"
                />
              </label>
              <label class="filter-select">
                <span class="sr-only">출처 필터</span>
                <select id="source-filter">
                  <option value="">모든 출처</option>
                </select>
                <span class="filter-arrow">
                  <svg class="icon" aria-hidden="true" focusable="false">
                    <use href="./src/shared/ui/icons.svg#chevron-down"></use>
                  </svg>
                </span>
              </label>
            </div>
            <div class="filter-toolbar">
              <div id="filter-summary" class="filter-summary"></div>
              <button id="clear-filters" class="clear-filters" type="button" hidden>
                선택 초기화
              </button>
            </div>
            <p class="status-message" id="feed-status" role="status" hidden></p>
            <div class="notice-list" id="notice-list" aria-live="polite"></div>
            <div class="empty-state" id="empty-state" hidden>
              <div class="empty-icon">
                <svg class="icon" aria-hidden="true" focusable="false">
                  <use href="./src/shared/ui/icons.svg#search"></use>
                </svg>
              </div>
              <strong>조건에 맞는 공고가 없어요</strong>
              <p>검색어를 줄이거나 카테고리 선택을 바꿔 보세요.</p>
            </div>
          </div>
        </section>
      </main>
    </div>
    <dialog class="modal-backdrop" id="detail-modal" aria-labelledby="detail-title">
      <section class="detail-dialog">
        <button class="close-button" id="close-detail" type="button" aria-label="닫기">
          <svg class="icon" aria-hidden="true" focusable="false">
            <use href="./src/shared/ui/icons.svg#close"></use>
          </svg>
        </button>
        <div id="detail-content"></div>
      </section>
    </dialog>
    <script type="module" src="./src/app/main.js"></script>
  </body>
</html>
